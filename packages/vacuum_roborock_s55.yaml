homeassistant:
  customize:
    vacuum.roborock_s7:
      icon: cil:roborock-vacuum
    sensor.roborock_s7_last_clean_end:
      friendly_name: Last Cleaned
      icon: mdi:calendar-clock

template:
  - sensor:
      - unique_id: vacuum_filter
        state: >
          {% set entity_id = 'sensor._filter_left' %}
          {{ (states(entity_id) | int(default=0) / 5400) | int(default=0) }}
        attributes:
          friendly_name: Filter
          icon: cil:roborock-filter
          unit_of_measurement: "%"

      - unique_id: vacuum_mainbrush
        state: >
          {% set entity_id = 'sensor.roborock_s7_main_brush_left' %}
          {{ (states(entity_id) | int(default=0) / 10800) | int(default=0) }}
        attributes:
          friendly_name: Main Brush
          icon: cil:roborock-mainbrush
          unit_of_measurement: "%"

      - unique_id: vacuum_sensors
        state: >
          {% set entity_id = 'sensor.roborock_s7_sensor_dirty_left' %}
          {{ (states(entity_id) | int(default=0) / 1080) | int(default=0) }}
        attributes:
          friendly_name: Sensor
          icon: cil:roborock-sensor
          unit_of_measurement: "%"

      - unique_id: vacuum_sidebrush
        state: >
          {% set entity_id = 'sensor.roborock_s7_side_brush_left' %}
          {{ (states(entity_id) | int(default=0) / 7200) | int(default=0) }}
        attributes:
          friendly_name: Sidebrush
          icon: cil:roborock-sidebrush
          unit_of_measurement: "%"

automation:
  - alias: vacuum_empty_bin
    id: "5443599527378"
    variables:
      vacuum: vacuum.roborock_s7
    trigger:
      platform: state
      entity_id: sensor.roborock_s7_total_clean_count
    condition: >
      {{ not is_state(vacuum, 'docked') }}
    action:
      - delay:
          seconds: 2
      - if: >
          {{ is_state(vacuum, 'returning') }}
        then:
          - service: vacuum.pause
            target:
              entity_id: >
                {{ vacuum }}
          - delay:
              seconds: 2
          - service: xiaomi_miio.vacuum_goto
            target:
              entity_id: >
                {{ vacuum }}
            data:
              x_coord: 16821
              y_coord: 23105
