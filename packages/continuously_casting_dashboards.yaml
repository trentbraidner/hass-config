#         volume: 3 #Optional: Volume to set the display. (If you remove this, the device will remain the same volume)
#         start_time: "07:00" #Optional: Set the start time for this device
#         end_time: "22:00" #Optional: Set the end time for this device
#       - dashboard_url: "http://192.168.1.5:5050/?view=Home&menu=false" #Required: Dashboard URL to be casted (This must be the local IP address of your HA instance, not homeassistant.local)
